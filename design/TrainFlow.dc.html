<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeAPI — Training flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
a{color:#EDEEF0}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#6E727A}
.ph{width:390px;height:844px;border-radius:36px;background:#0A0B0D;border:1px solid #24262B;overflow:hidden;position:relative;box-sizing:border-box;flex:none}
.cap{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8E96;letter-spacing:.06em}
.lbl{font-size:14px;color:#EDEEF0;margin-top:14px;text-align:center}
.lbl small{display:block;color:#8A8E96;font-size:12px;margin-top:4px}
.card{border-radius:20px;border:1px solid #1F2125;background:#121316}
.ico{width:40px;height:40px;border-radius:20px;background:#1A1C20;color:#C9CBD0;display:flex;align-items:center;justify-content:center;border:0;flex:none;text-decoration:none}
.dl{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:48px;border-top:1px solid #1A1B1F}
.chip{height:32px;padding:0 12px;border-radius:16px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;border:1px solid #2C2F36;color:#A1A4AB;background:transparent}
.add{width:36px;height:36px;border-radius:12px;border:0;background:#33231F;color:#FF8F70;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
</style>
</helmet>
<div style="width: 1760px; height: 1100px; box-sizing: border-box; padding: 40px; background: #08090A; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px"><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Train — logging flow</h1><span style="font-size: 13px; color: #A1A4AB">Type in the picker: no match → create the exercise inline and it's saved for reuse</span></header>
<div style="display: flex; gap: 40px; align-items: flex-start">

<figure style="margin: 0">
<div class="ph">
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 20px 16px; opacity: 0.3; display: flex; flex-direction: column; gap: 14px"><div style="height: 44px; border-radius: 22px; background: #1A1C20"></div><div style="height: 260px; border-radius: 18px; background: #15161A"></div></div>
<div style="position: absolute; inset: 0; background: rgba(5,6,8,0.62)"></div>
<section role="dialog" aria-label="Add exercise" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #121316; border-top: 1px solid #24262B; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3F4A"></span>
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 20px; font-weight: 600">Add exercise</h2><span style="font-size: 13px; color: #8A8E96">{{ addedCount }} added</span></div>
<label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: #0D0E10; border: 1.5px solid #FF8F70; box-sizing: border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8E96" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg><span style="position: absolute; left: -9999px">Search exercises</span><input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search or name a new one" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #EDEEF0; font-family: Inter, sans-serif; font-size: 16px"></label>
<sc-if value="{{ canCreate }}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 16px; border: 1px dashed #5A3A30; background: #1A1311; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 14px">Create <span style="font-weight: 600">“{{ qTitle }}”</span></span><button onClick="{{ create }}" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 0; background: #FF8F70; color: #0A0B0D; font-size: 13px; font-weight: 700">Create &amp; add</button></div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="chip" style="border-color: #5A3A30; color: #FF8F70; background: #33231F">Shoulders</span><span class="chip">Chest</span><span class="chip">Barbell</span><span class="chip">kg × reps</span></div>
</div>
</sc-if>
<span class="cap" style="padding: 4px 2px 0">{{ listTitle }}</span>
<div style="border-radius: 16px; border: 1px solid #1F2125; overflow: hidden">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
<div class="dl" style="border-top: {{ r.div }}"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{ r.name }}</span><span style="font-size: 12px; color: #8A8E96">{{ r.meta }}</span></span><button onClick="{{ r.add }}" class="add" aria-label="Add {{ r.name }}" style="background: {{ r.addBg }}; color: {{ r.addFg }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.icon }}"></path></svg></button></div>
</sc-for>
</div>
</section>
</div>
<figcaption class="lbl">Exercise picker<small>Recent first · search · create inline mid-workout</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><a href="Train.dc.html" class="ico" aria-label="Back"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a><span style="flex: 1; font-size: 18px; font-weight: 600">Templates</span><span class="ico" aria-label="New template"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></div>
<sc-for list="{{ templates }}" as="t" hint-placeholder-count="4">
<div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{ t.name }}</span><span style="font-size: 12px; color: #8A8E96">{{ t.meta }}</span></span><a href="WorkoutSession.dc.html" style="height: 36px; padding: 0 14px; border-radius: 12px; background: {{ t.btnBg }}; color: {{ t.btnFg }}; font-size: 13px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Start</a></div>
<span style="font-size: 13px; color: #A1A4AB; line-height: 1.45">{{ t.list }}</span>
</div>
</sc-for>
<button style="height: 48px; border-radius: 16px; border: 1px dashed #2C2F36; background: transparent; color: #A1A4AB; font-size: 14px; font-weight: 500">Save last workout as template</button>
<a href="WorkoutSession.dc.html" style="height: 48px; border-radius: 16px; border: 1px solid #2C2F36; color: #EDEEF0; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Start empty workout</a>
</div>
</div>
<figcaption class="lbl">Templates<small>One tap to start; schedule badge shows today's</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="flex: 1; font-size: 18px; font-weight: 600">Bench press</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8A8E96">e1RM</span><span style="font-size: 18px; font-weight: 600">101.8</span><span style="font-size: 11px; color: #8BE3A5">+7.8 · 12 wk</span></div>
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8A8E96">Best set</span><span style="font-size: 18px; font-weight: 600">92.5×3</span><span style="font-size: 11px; color: #8A8E96">9 Nov</span></div>
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8A8E96">Sessions</span><span style="font-size: 18px; font-weight: 600">38</span><span style="font-size: 11px; color: #8A8E96">since May</span></div>
</div>
<div class="card" style="padding: 14px 12px 8px">
<div style="display: flex; gap: 6px; padding: 0 4px 10px"><span class="chip" style="background: #33231F; border-color: #5A3A30; color: #FF8F70; height: 28px">e1RM</span><span class="chip" style="height: 28px">Top set</span><span class="chip" style="height: 28px">Volume</span></div>
<svg role="img" aria-label="Bench press estimated one-rep max over 6 months, from 88 to 101.8 kg" width="100%" height="120" viewBox="0 0 336 120"><line x1="0" y1="30" x2="336" y2="30" stroke="#1A1C20"></line><line x1="0" y1="70" x2="336" y2="70" stroke="#1A1C20"></line><path d="M0 104 L28 100 L56 98 L84 92 L112 94 L140 84 L168 80 L196 76 L224 70 L252 60 L280 52 L308 40 L334 22" fill="none" stroke="#FF8F70" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><g fill="#FF8F70"><circle cx="140" cy="84" r="3.5"></circle><circle cx="252" cy="60" r="3.5"></circle><circle cx="334" cy="22" r="4"></circle></g><g fill="#8A8E96" font-size="10" font-family="JetBrains Mono, monospace"><text x="0" y="118">JUN</text><text x="160" y="118">AUG</text><text x="300" y="118">NOV</text></g></svg>
</div>
<div class="card" style="overflow: hidden">
<sc-for list="{{ benchHist }}" as="h" hint-placeholder-count="5">
<div class="dl" style="border-top: {{ h.div }}"><span style="width: 50px; font-size: 13px; color: #A1A4AB">{{ h.date }}</span><span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{ h.sets }}</span><sc-if value="{{ h.pr }}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 6px; border-radius: 10px; background: #33231F; color: #FFB29C; font-size: 10px; font-weight: 700; display: flex; align-items: center">PR</span></sc-if></div>
</sc-for>
</div>
</div>
</div>
<figcaption class="lbl">Exercise history<small>Opened from any exercise name, also mid-workout</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="border-radius: 16px; background: #1A1513; border: 1px solid #3A2A24; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">Push A · paused</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A4AB">32:14 · paused 4:12</span></span><a href="WorkoutSession.dc.html" style="height: 36px; padding: 0 14px; border-radius: 12px; background: #FF8F70; color: #0A0B0D; font-size: 13px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Resume</a></div>
<span style="font-size: 11px; color: #8A8E96; margin-top: -6px">↑ Paused bar — stays on top of every tab until resumed or finished</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 6px"><span class="cap" style="color: #FF8F70">WORKOUT COMPLETE</span><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Push A</span><span style="font-size: 13px; color: #A1A4AB">Sat 14 Nov · 18:10–19:08</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center"><span style="font-size: 11px; color: #8A8E96">Time</span><span style="font-size: 18px; font-weight: 600">54:00</span><span style="font-size: 11px; color: #8A8E96">active</span></div>
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center"><span style="font-size: 11px; color: #8A8E96">Volume</span><span style="font-size: 18px; font-weight: 600">9,640</span><span style="font-size: 11px; color: #8BE3A5">+520 kg</span></div>
<div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center"><span style="font-size: 11px; color: #8A8E96">Sets</span><span style="font-size: 18px; font-weight: 600">19</span><span style="font-size: 11px; color: #8A8E96">6 exercises</span></div>
</div>
<div style="border-radius: 18px; border: 1px solid #3A2A24; background: #1A1311; padding: 14px 16px; display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 12px; background: #33231F; color: #FFB29C; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">PR</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Bench press 90 × 4</span><span style="font-size: 12px; color: #A1A4AB">e1RM 102.0 · beats 101.8</span></span></div>
<div class="card" style="overflow: hidden">
<div class="dl" style="border-top: 0"><span style="flex: 1; font-size: 14px">Bench press</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A4AB">5 sets · top 90×4</span></div>
<div class="dl"><span style="flex: 1; font-size: 14px">Incline DB press</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A4AB">3 × 10 · 30</span></div>
<div class="dl"><span style="flex: 1; font-size: 14px">Landmine press <span style="font-size: 11px; color: #FF8F70">new</span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A4AB">3 × 10 · 25</span></div>
<div class="dl"><span style="flex: 1; font-size: 14px; color: #A1A4AB">+ 3 more · Edit workout</span></div>
</div>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: auto"><button style="height: 52px; border-radius: 16px; border: 1px solid #2C2F36; background: transparent; color: #A1A4AB; font-size: 14px">Discard</button><a href="Train.dc.html" style="height: 52px; border-radius: 16px; background: #FF8F70; color: #0A0B0D; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Save workout</a></div>
</div>
</div>
<figcaption class="lbl">Pause &amp; finish<small>Persistent paused bar · summary with PRs, edit before save</small></figcaption>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      q: 'landmine press',
      added: {},
      lib: [
        { name: 'Cable fly', meta: 'Chest · last 3×12 · 20 kg', recent: true },
        { name: 'Lateral raise', meta: 'Shoulders · last 4×15 · 10 kg', recent: true },
        { name: 'Triceps pushdown', meta: 'Arms · last 3×12 · 32.5 kg', recent: true },
        { name: 'Overhead press', meta: 'Shoulders · last 3×8 · 52.5 kg', recent: true },
        { name: 'Dips', meta: 'Chest · last 3×10 · BW+10', recent: false },
        { name: 'Arnold press', meta: 'Shoulders · last 3×10 · 16 kg', recent: false },
        { name: 'Incline DB press', meta: 'Chest · last 3×10 · 30 kg', recent: false },
        { name: 'Face pull', meta: 'Shoulders · last 3×15 · 25 kg', recent: false }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const q = (st.q || '').trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const matches = q ? st.lib.filter((e) => words.some((w) => e.name.toLowerCase().indexOf(w) >= 0) || e.meta.toLowerCase().indexOf(q) >= 0) : st.lib.filter((e) => e.recent);
    const exact = st.lib.some((e) => e.name.toLowerCase() === q);
    const plus = 'M12 5v14M5 12h14', check = 'M5 12.5l4.5 4.5L19 7.5';
    const shown = (matches.length ? matches : st.lib.filter((e) => e.recent)).slice(0, 6);
    const results = shown.map((e, i) => {
      const on = !!st.added[e.name];
      return { name: e.name, meta: e.meta, div: i ? '1px solid #1A1B1F' : '0', icon: on ? check : plus,
        addBg: on ? '#FF8F70' : '#33231F', addFg: on ? '#0A0B0D' : '#FF8F70',
        add: () => this.setState({ added: Object.assign({}, st.added, { [e.name]: !on }) }) };
    });
    const title = q.replace(/\b\w/g, (c) => c.toUpperCase());
    return {
      q: st.q,
      onQ: (ev) => this.setState({ q: ev.target.value }),
      canCreate: !!q && !exact,
      qTitle: title,
      listTitle: q ? (matches.length ? 'MATCHES' : 'NO MATCH · RECENT') : 'RECENT',
      results,
      addedCount: Object.keys(st.added).filter((k) => st.added[k]).length,
      create: () => {
        const name = title;
        this.setState({ lib: [{ name, meta: 'New · Shoulders · saved to library', recent: true }].concat(st.lib), added: Object.assign({}, st.added, { [name]: true }), q: '' });
      },
      templates: [
        { name: 'Push A', meta: 'Mon · Sat · last used Mon 9 Nov', list: 'Bench press, Incline DB press, Overhead press, Cable fly, Lateral raise, Triceps pushdown', btnBg: '#FF8F70', btnFg: '#0A0B0D' },
        { name: 'Pull B', meta: 'Thu · last used Thu 12 Nov', list: 'Weighted pull-up, Barbell row, Chest-supported row, Face pull, Curl', btnBg: '#24262B', btnFg: '#EDEEF0' },
        { name: 'Legs', meta: 'Wed · last used Wed 11 Nov', list: 'Back squat, Romanian deadlift, Leg press, Leg curl, Calf raise', btnBg: '#24262B', btnFg: '#EDEEF0' },
        { name: 'Hotel upper', meta: 'Travel · dumbbells only', list: 'DB press, One-arm row, Arnold press, Push-ups, Lateral raise', btnBg: '#24262B', btnFg: '#EDEEF0' }
      ],
      benchHist: [
        { date: '9 Nov', sets: '92.5×3 · 87.5×6 ×2 · 87.5×5', pr: true, div: '0' },
        { date: '5 Nov', sets: '87.5×6 ×3 · 87.5×5', pr: false, div: '1px solid #1A1B1F' },
        { date: '2 Nov', sets: '85×6 ×4', pr: false, div: '1px solid #1A1B1F' },
        { date: '29 Oct', sets: '85×6 ×3 · 85×5', pr: false, div: '1px solid #1A1B1F' },
        { date: '26 Oct', sets: '82.5×6 ×4', pr: false, div: '1px solid #1A1B1F' }
      ]
    };
  }
}
</script>
</body>
</html>
