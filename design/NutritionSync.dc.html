<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeAPI — Nutrition sync &amp; entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
button{font-family:inherit}
.ph{width:390px;height:844px;border-radius:36px;background:#0A0B0D;border:1px solid #24262B;overflow:hidden;position:relative;box-sizing:border-box;flex:none}
.cap{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8E96;letter-spacing:.06em}
.lbl{font-size:14px;color:#EDEEF0;margin-top:14px;text-align:center}
.lbl small{display:block;color:#8A8E96;font-size:12px;margin-top:4px}
.card{border-radius:20px;border:1px solid #1F2125;background:#121316}
.ico{width:40px;height:40px;border-radius:20px;background:#1A1C20;color:#C9CBD0;display:flex;align-items:center;justify-content:center;border:0;flex:none}
.sw{width:44px;height:28px;border-radius:14px;position:relative;flex:none;display:block}
.sw i{position:absolute;top:4px;width:20px;height:20px;border-radius:10px}
.pill{height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:17px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;border:1px solid #2C2F36;color:#A1A4AB}
.chip.on{background:#2E271E;border-color:#5A4A33;color:#F3B76A}
.mf{border-radius:12px;background:#0D0E10;border:1px solid #24262B;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.mf span:first-child{font-size:11px;color:#8A8E96}
.mf span:last-child{font-size:16px;font-weight:600}
.dl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid #1A1B1F}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 1330px; height: 1100px; box-sizing: border-box; padding: 40px; background: #08090A; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px"><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Nutrition — FatSecret, manual entry, history</h1><span style="font-size: 13px; color: #A1A4AB">Sync is a source, never a dependency: manual entry always works</span></header>
<div style="display: flex; gap: 40px; align-items: flex-start">

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="flex: 1; font-size: 18px; font-weight: 600">Food sources</span></div>
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #2E271E; color: #F3B76A; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">FS</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">FatSecret</span><span style="font-size: 12px; color: #8A8E96">Connected · diary + food database</span></span><span class="pill" style="background: #18261E; color: #8BE3A5"><span style="width: 6px; height: 6px; border-radius: 3px; background: #8BE3A5"></span>Synced</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="border-radius: 12px; background: #17181C; padding: 10px 12px"><span style="display: block; font-size: 11px; color: #8A8E96">Last sync</span><span style="font-size: 14px; font-weight: 600">18:42 · 4 min ago</span></div>
<div style="border-radius: 12px; background: #17181C; padding: 10px 12px"><span style="display: block; font-size: 11px; color: #8A8E96">Imported today</span><span style="font-size: 14px; font-weight: 600">3 meals · 1,640 kcal</span></div>
</div>
<button style="height: 44px; border-radius: 14px; border: 1px solid #2C2F36; background: transparent; color: #EDEEF0; font-size: 14px; font-weight: 500">Sync now</button>
</div>
<span class="cap" style="padding: 0 4px">STATUS STATES</span>
<div class="card" style="overflow: hidden">
<div class="dl" style="border-top: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F3B76A" stroke-width="2.4" stroke-linecap="round" style="animation: spin 1s linear infinite"><path d="M12 3a9 9 0 1 0 9 9"></path></svg><span style="flex: 1; font-size: 14px">Syncing 2 entries…</span><span style="font-size: 12px; color: #8A8E96">just now</span></div>
<div class="dl"><span style="width: 16px; height: 16px; border-radius: 8px; background: #33211C; color: #FF9A8F; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">!</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Sign-in expired</span><span style="font-size: 12px; color: #8A8E96">Last good sync 09:10 · manual entries kept</span></span><span style="font-size: 13px; color: #F3B76A; font-weight: 600">Reconnect</span></div>
<div class="dl"><span style="width: 16px; height: 16px; border-radius: 8px; background: #24262B"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Offline</span><span style="font-size: 12px; color: #8A8E96">Will sync when connected</span></span></div>
</div>
<div class="card" style="overflow: hidden">
<div class="dl" style="border-top: 0"><span style="flex: 1; font-size: 14px">Import meals</span><span class="sw" style="background: #F3B76A"><i style="left: 20px; background: #0A0B0D"></i></span></div>
<div class="dl"><span style="flex: 1; font-size: 14px">Import weigh-ins</span><span class="sw" style="background: #2C2F36"><i style="left: 4px; background: #8A8E96"></i></span></div>
<div class="dl"><span style="flex: 1; font-size: 14px">If both edited</span><span style="font-size: 13px; color: #A1A4AB">Keep newest ›</span></div>
</div>
</div>
</div>
<figcaption class="lbl">FatSecret connection<small>Last sync, sync now, syncing / expired / offline</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="position: absolute; inset: 0; background: rgba(5,6,8,0.62)"></div>
<section role="dialog" aria-label="Add food manually" style="position: absolute; left: 0; right: 0; bottom: 0; top: 60px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #121316; border-top: 1px solid #24262B; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3F4A"></span>
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 20px; font-weight: 600">Add food</h2><span style="font-size: 13px; color: #F3B76A">Search FatSecret</span></div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A1A4AB">Food</span><span style="display: flex; align-items: center; height: 50px; padding: 0 14px; border-radius: 14px; background: #0D0E10; border: 1.5px solid #F3B76A; box-sizing: border-box"><input value="Salmon fillet, baked" readonly style="flex: 1; border: 0; outline: none; background: transparent; color: #EDEEF0; font-family: Inter, sans-serif; font-size: 16px"></span></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #A1A4AB">Amount</span>
<div style="display: flex; align-items: center; gap: 8px"><button aria-label="Less" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #24262B; color: #EDEEF0; font-size: 20px">−</button><span style="flex: 1; text-align: center; font-size: 26px; font-weight: 700">180 <span style="font-size: 14px; color: #8A8E96; font-weight: 500">g</span></span><button aria-label="More" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #24262B; color: #EDEEF0; font-size: 20px">+</button></div>
<div style="display: flex; gap: 6px"><span class="chip">100 g</span><span class="chip">150 g</span><span class="chip on">180 g</span><span class="chip">1 fillet</span></div></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div class="mf"><span>kcal</span><span>374</span></div><div class="mf"><span>Protein</span><span style="color: #93A9FF">40 g</span></div><div class="mf"><span>Carbs</span><span style="color: #F3B76A">0 g</span></div><div class="mf"><span>Fat</span><span style="color: #FF8F70">23 g</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #A1A4AB">Meal</span><div style="display: flex; gap: 6px"><span class="chip">Breakfast</span><span class="chip">Lunch</span><span class="chip on">Dinner</span><span class="chip">Snack</span></div></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="flex: 1; font-size: 14px">Save to My foods</span><span class="sw" style="background: #F3B76A"><i style="left: 20px; background: #0A0B0D"></i></span></div>
<button style="margin-top: auto; height: 52px; border-radius: 16px; border: 0; background: #F3B76A; color: #0A0B0D; font-size: 15px; font-weight: 600">Log 374 kcal to Dinner</button>
</section>
</div>
<figcaption class="lbl">Manual entry<small>Fallback that's as fast as search: portion chips, editable macros</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="flex: 1; font-size: 18px; font-weight: 600">History &amp; goals</span></div>
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">Week 46 goals</span><span style="font-size: 12px; color: #8A8E96">Mon–Sat</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Calories in range</span><span style="color: #A1A4AB">4 of 6 days</span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><span style="height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="height: 8px; border-radius: 4px; background: #3A3226"></span><span style="height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="height: 8px; border-radius: 4px; background: #3A3226"></span><span style="height: 8px; border-radius: 4px; background: #1A1C20"></span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Protein ≥ 160 g</span><span style="color: #A1A4AB">5 of 6 days</span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><span style="height: 8px; border-radius: 4px; background: #93A9FF"></span><span style="height: 8px; border-radius: 4px; background: #93A9FF"></span><span style="height: 8px; border-radius: 4px; background: #93A9FF"></span><span style="height: 8px; border-radius: 4px; background: #93A9FF"></span><span style="height: 8px; border-radius: 4px; background: #93A9FF"></span><span style="height: 8px; border-radius: 4px; background: #252A3D"></span><span style="height: 8px; border-radius: 4px; background: #1A1C20"></span></div></div>
<span style="font-size: 12px; color: #8A8E96">Avg 2,318 kcal · 151 g P · 262 g C · 74 g F</span>
</div>
<div class="card" style="overflow: hidden">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="6">
<div class="dl" style="border-top: {{ d.div }}"><span style="width: 52px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #8A8E96">{{ d.dow }}</span><span style="font-size: 15px; font-weight: 600">{{ d.d }}</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{ d.kcal }} kcal</span><span style="font-size: 12px; color: #8A8E96">{{ d.macro }}</span></span><span class="pill" style="background: #17181C; color: #A1A4AB; font-weight: 500">{{ d.src }}</span><span style="width: 18px; height: 18px; border-radius: 9px; background: {{ d.dot }}"></span></div>
</sc-for>
</div>
</div>
</div>
<figcaption class="lbl">Meal history &amp; weekly goals<small>Source badge per day: FatSecret / Manual / Mixed</small></figcaption>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const hit = '#F3B76A', miss = '#3A3226';
    return {
      days: [
        { dow: 'Fri', d: 13, kcal: '2,452', macro: 'P 168 · C 274 · F 81', src: 'Mixed', dot: hit, div: '0' },
        { dow: 'Thu', d: 12, kcal: '2,210', macro: 'P 162 · C 241 · F 70', src: 'FatSecret', dot: miss, div: '1px solid #1A1B1F' },
        { dow: 'Wed', d: 11, kcal: '2,486', macro: 'P 171 · C 288 · F 76', src: 'FatSecret', dot: hit, div: '1px solid #1A1B1F' },
        { dow: 'Tue', d: 10, kcal: '2,344', macro: 'P 158 · C 262 · F 74', src: 'Manual', dot: hit, div: '1px solid #1A1B1F' },
        { dow: 'Mon', d: 9, kcal: '2,410', macro: 'P 165 · C 270 · F 75', src: 'FatSecret', dot: hit, div: '1px solid #1A1B1F' },
        { dow: 'Sun', d: 8, kcal: '1,980', macro: 'P 121 · C 222 · F 66', src: 'Manual', dot: miss, div: '1px solid #1A1B1F' }
      ]
    };
  }
}
</script>
</body>
</html>
