<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeAPI — Intelligence</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
a{color:#EDEEF0}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
.ph{width:390px;height:844px;border-radius:36px;background:#0A0B0D;border:1px solid #24262B;overflow:hidden;position:relative;box-sizing:border-box;flex:none}
.cap{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8E96;letter-spacing:.06em}
.lbl{font-size:14px;color:#EDEEF0;margin-top:14px;text-align:center}
.lbl small{display:block;color:#8A8E96;font-size:12px;margin-top:4px}
.card{border-radius:20px;border:1px solid #1F2125;background:#121316}
.ico{width:40px;height:40px;border-radius:20px;background:#1A1C20;color:#C9CBD0;display:flex;align-items:center;justify-content:center;border:0;text-decoration:none;flex:none}
@keyframes sh{0%{opacity:.45}50%{opacity:.9}100%{opacity:.45}}
.sk{border-radius:6px;background:#202227;animation:sh 1.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 1330px; height: 1100px; box-sizing: border-box; padding: 40px; background: #08090A; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px"><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">LifeAPI Intelligence</h1><span style="font-size: 13px; color: #A1A4AB">Short, sourced, actionable. No chat as the primary UI.</span></header>
<div style="display: flex; gap: 40px; align-items: flex-start">

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<a href="Main.dc.html" class="ico" aria-label="Back"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex: 1; font-size: 18px; font-weight: 600">Intelligence</span>
<button onClick="{{ refresh }}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #2B3318; background: #151A0C; color: #D3F36B; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>{{ refreshLabel }}</button>
</div>
<div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: #121316; border: 1px solid #1F2125">
<span role="tab" aria-selected="true" style="height: 34px; border-radius: 10px; background: #24262B; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">Daily</span><span role="tab" style="height: 34px; color: #8A8E96; font-size: 13px; display: flex; align-items: center; justify-content: center">Weekly</span><span role="tab" style="height: 34px; color: #8A8E96; font-size: 13px; display: flex; align-items: center; justify-content: center">Monthly</span>
</div>
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px"><span class="cap" style="color: #D3F36B">ANALYSING 30 DAYS…</span><span class="sk" style="height: 14px; width: 92%"></span><span class="sk" style="height: 14px; width: 80%"></span><span class="sk" style="height: 14px; width: 64%"></span></div>
</sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 20px; border: 1px solid #262D18; background: #12140F; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span class="cap" style="color: #D3F36B">DAILY SUMMARY · SAT 14 NOV</span>
<span style="font-size: 15px; line-height: 1.5">A strong day so far: score 77, +6 on your average. Fuel is the gap — 560 kcal and 32 g protein short with dinner still open.</span>
<span style="font-size: 12px; color: #8A8E96">Uses: Day Score, Nutrition, Health · updated 18:02</span>
</div>
</sc-if>
<span class="cap" style="padding: 0 4px">DO NEXT</span>
<div class="card" style="overflow: hidden">
<a href="Nutrition.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #EDEEF0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F3B76A"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Log your usual dinner</span><span style="font-size: 12px; color: #8A8E96">Salmon &amp; potatoes closes 85% of the protein gap</span></span><span style="font-size: 13px; color: #F3B76A; font-weight: 600">Log</span></a>
<a href="TrainFlow.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #1A1B1F; text-decoration: none; color: #EDEEF0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF8F70"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Push A — try 90 kg × 4</span><span style="font-size: 12px; color: #8A8E96">Recovery 82 · bench e1RM up 3 sessions in a row</span></span><span style="font-size: 13px; color: #FF8F70; font-weight: 600">Start</span></a>
<a href="Projects.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #1A1B1F; text-decoration: none; color: #EDEEF0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C5A1FF"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">LifeAPI: ship the Room schema PR</span><span style="font-size: 12px; color: #8A8E96">Next action stalled 3 days · 25-min focus fits before 21:30</span></span><span style="font-size: 13px; color: #C5A1FF; font-weight: 600">Focus</span></a>
</div>
<span class="cap" style="padding: 0 4px">PATTERNS</span>
<a href="#why" class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #EDEEF0"><span style="font-size: 12px; color: #93A9FF">Money</span><span style="font-size: 14px; line-height: 1.45">Eating out is €36 over budget. 4 of 6 visits were weekday coffees, avg €4.50.</span><span style="font-size: 12px; color: #8A8E96">See the numbers →</span></a>
</div>
</div>
<figcaption class="lbl">Insights home<small>Summary → next actions → patterns. Refresh shows loading</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph" id="why">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="font-size: 18px; font-weight: 600">Why this insight</span></div>
<p style="margin: 0; font-size: 18px; line-height: 1.45; font-weight: 500; letter-spacing: -0.01em">Your 3 best recovery days this month all followed lights-out before 23:30.</p>
<div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span class="cap">RECOVERY vs LIGHTS-OUT · 30 NIGHTS</span>
<svg role="img" aria-label="Scatter of recovery against bedtime; earlier bedtimes cluster at higher recovery" width="100%" height="150" viewBox="0 0 326 150">
<line x1="140" y1="0" x2="140" y2="130" stroke="#D3F36B" stroke-dasharray="3 4" opacity="0.6"></line>
<text x="144" y="12" fill="#D3F36B" font-size="10" font-family="JetBrains Mono, monospace">23:30</text>
<g fill="#62D6C6"><circle cx="60" cy="22" r="5"></circle><circle cx="84" cy="30" r="5"></circle><circle cx="100" cy="26" r="5"></circle></g>
<g fill="#3E6E68"><circle cx="40" cy="50" r="4"></circle><circle cx="72" cy="46" r="4"></circle><circle cx="110" cy="58" r="4"></circle><circle cx="122" cy="40" r="4"></circle><circle cx="130" cy="66" r="4"></circle><circle cx="96" cy="70" r="4"></circle><circle cx="150" cy="62" r="4"></circle><circle cx="164" cy="78" r="4"></circle><circle cx="176" cy="54" r="4"></circle><circle cx="190" cy="88" r="4"></circle><circle cx="204" cy="72" r="4"></circle><circle cx="214" cy="98" r="4"></circle><circle cx="226" cy="84" r="4"></circle><circle cx="240" cy="104" r="4"></circle><circle cx="254" cy="92" r="4"></circle><circle cx="268" cy="112" r="4"></circle><circle cx="282" cy="100" r="4"></circle><circle cx="296" cy="118" r="4"></circle><circle cx="180" cy="66" r="4"></circle><circle cx="158" cy="92" r="4"></circle><circle cx="230" cy="64" r="4"></circle><circle cx="118" cy="82" r="4"></circle><circle cx="270" cy="80" r="4"></circle><circle cx="66" cy="62" r="4"></circle><circle cx="246" cy="120" r="4"></circle><circle cx="198" cy="108" r="4"></circle><circle cx="140" cy="100" r="4"></circle></g>
<g fill="#8A8E96" font-size="10" font-family="JetBrains Mono, monospace"><text x="0" y="146">22:30</text><text x="128" y="146">23:30</text><text x="290" y="146">01:00</text></g>
</svg>
</div>
<div class="card" style="overflow: hidden">
<div style="padding: 12px 14px 4px"><span class="cap">SUPPORTING DATA</span></div>
<div style="display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13px"><span style="color: #A1A4AB">Mon 9 Nov · recovery 91</span><span class="cap" style="color: #EDEEF0">23:12</span></div>
<div style="display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13px"><span style="color: #A1A4AB">Mon 2 Nov · recovery 89</span><span class="cap" style="color: #EDEEF0">23:20</span></div>
<div style="display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13px"><span style="color: #A1A4AB">Thu 12 Nov · recovery 88</span><span class="cap" style="color: #EDEEF0">23:05</span></div>
<div style="display: flex; justify-content: space-between; padding: 8px 14px 12px; font-size: 13px; border-top: 1px solid #1A1B1F"><span style="color: #A1A4AB">Strength of link</span><span style="color: #F3B76A">moderate · r = 0.46</span></div>
</div>
<span style="font-size: 12px; line-height: 1.5; color: #8A8E96">A pattern, not proof. Shared with AI provider: bedtimes and recovery scores only — no names, notes or amounts.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="height: 44px; border-radius: 14px; border: 1px solid #24262B; background: transparent; color: #EDEEF0; font-size: 14px; font-weight: 500">Useful</button><button style="height: 44px; border-radius: 14px; border: 1px solid #24262B; background: transparent; color: #A1A4AB; font-size: 14px; font-weight: 500">Not for me</button></div>
</div>
</div>
<figcaption class="lbl">Insight detail<small>Every claim shows its numbers and what was shared</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<span style="font-size: 18px; font-weight: 600; padding-top: 8px">Reports</span>
<div role="tablist" aria-label="Preview state" style="display: flex; gap: 6px">
<sc-for list="{{ stateTabs }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: {{ t.border }}; background: {{ t.bg }}; color: {{ t.fg }}; font-size: 12px; font-weight: 600">{{ t.label }}</button></sc-for>
</div>
<sc-if value="{{ sLoading }}" hint-placeholder-val="{{ true }}">
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 196px; box-sizing: border-box"><span class="cap" style="color: #D3F36B">WEEKLY REVIEW · WEEK 46</span><span style="font-size: 14px; color: #A1A4AB">Reading 7 days across 5 modules…</span><span class="sk" style="height: 12px; width: 94%"></span><span class="sk" style="height: 12px; width: 86%"></span><span class="sk" style="height: 12px; width: 70%"></span><span class="sk" style="height: 40px; width: 100%; border-radius: 12px"></span></div>
</sc-if>
<sc-if value="{{ sError }}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 196px; box-sizing: border-box; border-color: #3A2420"><span class="cap" style="color: #FF9A8F">COULDN'T GENERATE</span><span style="font-size: 16px; font-weight: 600">AI provider didn't respond</span><span style="font-size: 13px; line-height: 1.5; color: #A1A4AB">Nothing was saved or lost — your data stays on this phone. Last good report: Week 45.</span><button style="margin-top: auto; height: 44px; border-radius: 14px; border: 0; background: #24262B; color: #EDEEF0; font-size: 14px; font-weight: 600">Try again</button></div>
</sc-if>
<sc-if value="{{ sOff }}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 196px; box-sizing: border-box"><span class="cap">INTELLIGENCE IS OFF</span><span style="font-size: 16px; font-weight: 600">Choose what it may read</span><span style="font-size: 13px; line-height: 1.5; color: #A1A4AB">Nothing leaves the phone until you pick data categories. Everything else in LifeAPI works offline.</span><a href="Settings.dc.html" style="margin-top: auto; height: 44px; border-radius: 14px; background: #D3F36B; color: #0A0B0D; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Set up privacy</a></div>
</sc-if>
<span class="cap" style="padding: 4px 4px 0">HISTORY</span>
<div class="card" style="overflow: hidden">
<sc-for list="{{ history }}" as="h" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{ h.div }}"><span style="width: 36px; height: 36px; border-radius: 10px; background: #1A1C20; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #A1A4AB; display: flex; align-items: center; justify-content: center">{{ h.tag }}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{ h.title }}</span><span style="font-size: 12px; color: #8A8E96">{{ h.meta }}</span></span></div>
</sc-for>
</div>
</div>
</div>
<figcaption class="lbl">Reports &amp; states<small>Loading · error · off — tap the chips</small></figcaption>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: false, s: 'loading' }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const st = this.state;
    const tabs = [['loading', 'Loading'], ['error', 'Error'], ['off', 'Unavailable']].map((x) => ({
      label: x[1], sel: st.s === x[0],
      bg: st.s === x[0] ? '#EDEEF0' : 'transparent', fg: st.s === x[0] ? '#0A0B0D' : '#A1A4AB',
      border: st.s === x[0] ? '0' : '1px solid #2C2F36',
      pick: () => this.setState({ s: x[0] })
    }));
    return {
      loading: st.loading, ready: !st.loading,
      refreshLabel: st.loading ? 'Working…' : 'Refresh',
      refresh: () => { clearTimeout(this.t); this.setState({ loading: true }); this.t = setTimeout(() => this.setState({ loading: false }), 1800); },
      stateTabs: tabs,
      sLoading: st.s === 'loading', sError: st.s === 'error', sOff: st.s === 'off',
      history: [
        { tag: 'W45', title: 'Weekly review · 2–8 Nov', meta: 'Consistency 86% · 3 workouts · €512 spent', div: '0' },
        { tag: 'OCT', title: 'Monthly report · October', meta: 'Best month for sleep · saved 51%', div: '1px solid #1A1B1F' },
        { tag: 'W44', title: 'Weekly review · 26 Oct–1 Nov', meta: 'Deload week · reading streak started', div: '1px solid #1A1B1F' },
        { tag: 'PRJ', title: 'Project analysis · LifeAPI', meta: 'Output up, focus time down — 9 Nov', div: '1px solid #1A1B1F' },
        { tag: 'SEP', title: 'Monthly report · September', meta: '4 PRs · eating out over twice', div: '1px solid #1A1B1F' }
      ]
    };
  }
}
</script>
</body>
</html>
