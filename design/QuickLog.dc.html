<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeAPI — Quick Log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#EDEEF0}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#6E727A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B0D; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1">
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 28px 16px; display: flex; flex-direction: column; gap: 16px; opacity: 0.35">
<div style="height: 52px; width: 220px; border-radius: 12px; background: #1A1C20"></div>
<div style="height: 172px; border-radius: 24px; background: #15161A"></div>
<div style="height: 88px; border-radius: 18px; background: #15161A"></div>
</div>
<a href="Main.dc.html" aria-label="Close Quick Log" style="position: absolute; inset: 0; background: rgba(5,6,8,0.62)"></a>

<section role="dialog" aria-label="Quick Log" style="position: absolute; left: 0; right: 0; bottom: 0; height: 712px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #121316; border-top: 1px solid #24262B; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 60px rgba(0,0,0,0.5)">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3F4A"></span>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Log anything</h1>
<a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: #1A1C20; color: #C9CBD0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #A1A4AB">Type it the way you'd say it</span>
<span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: #0D0E10; border: 1.5px solid #D3F36B">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8E96" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<input value="{{ text }}" onChange="{{ onType }}" placeholder="coffee 4.50 · 500 ml · bench 90x5" style="flex: 1; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; color: #EDEEF0; font-family: Inter, sans-serif; font-size: 16px">
</span>
</label>

<sc-if value="{{ hasPreview }}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 18px; background: #191A1E; border: 1px solid #24262B; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{ pv.bg }}; color: {{ pv.fg }}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{ pv.tag }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{ pv.title }}</span><span style="font-size: 12px; color: #A1A4AB">{{ pv.meta }}</span></span>
<a href="Main.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #D3F36B; color: #0A0B0D; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Log</a>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8E96; letter-spacing: 0.06em">CATEGORIES</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="8">
<button onClick="{{ t.pick }}" style="height: 78px; border-radius: 16px; border: 1px solid #222328; background: #17181C; color: #EDEEF0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{ t.c }}"></span>
<span style="font-size: 12px; font-weight: 500">{{ t.label }}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8E96; letter-spacing: 0.06em; padding-bottom: 6px">AGAIN? ONE TAP</span>
<sc-for list="{{ recent }}" as="r" hint-placeholder-count="4">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; text-decoration: none; color: #EDEEF0">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{ r.c }}"></span>
<span style="flex: 1; font-size: 14px">{{ r.label }}</span>
<span style="font-size: 13px; color: #A1A4AB">{{ r.val }}</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E727A" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { text: 'flat white 4.50' }; }
  parse(t) {
    const s = (t || '').trim().toLowerCase();
    if (!s) return null;
    if (/magnesium|vitamin|omega|zinc|creatine|glycine/.test(s)) return { tag: 'RX', bg: '#14211F', fg: '#62D6C6', title: 'Magnesium glycinate · 400 mg', meta: 'Health · Evening stack · due 20:00' };
    if (/^slept/.test(s)) return { tag: 'ZZZ', bg: '#14211F', fg: '#62D6C6', title: 'Sleep · 7 h 24 m', meta: 'Health · 23:38 → 07:02 · last night' };
    if (/^(read|meditate|journal|spanish)/.test(s)) return { tag: 'HBT', bg: '#29233A', fg: '#C5A1FF', title: 'Read 20 pages ✔', meta: 'Grow · completes today’s habit · streak 24' };
    let m = s.match(/(\d+)\s*ml/);
    if (m) return { tag: 'H2O', bg: '#14211F', fg: '#62D6C6', title: '+' + m[1] + ' ml water', meta: 'Health · Water · now' };
    m = s.match(/^([a-z ]+?)\s*(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+)/);
    if (m) return { tag: 'SET', bg: '#33231F', fg: '#FF8F70', title: m[1].replace(/^\w/, (c) => c.toUpperCase()) + ' · ' + m[2] + ' kg × ' + m[3], meta: 'Train · adds a set to today' };
    m = s.match(/^([a-z ]+?)\s*€?\s*(\d+[.,]\d{1,2}|\d+)\s*€?$/);
    if (m) {
      const w = m[1].trim();
      if (/freelance|salary|refund|income/.test(w)) return { tag: 'EUR', bg: '#18261E', fg: '#8BE3A5', title: '+€' + m[2].replace(',', '.') + ' · ' + w.replace(/^\w/, (c) => c.toUpperCase()), meta: 'Money · Income · Swedbank' };
      const cat = /coffee|white|latte|lunch|dinner|bar|cafe/.test(w) ? 'Eating out' : /rimi|maxima|lidl|grocer/.test(w) ? 'Groceries' : /bolt|taxi|fuel|bus/.test(w) ? 'Transport' : 'Uncategorised';
      return { tag: 'EUR', bg: '#1E2233', fg: '#93A9FF', title: '€' + m[2].replace(',', '.') + ' · ' + w.replace(/^\w/, (c) => c.toUpperCase()), meta: 'Money · ' + cat + ' · Revolut' };
    }
    return { tag: 'FOOD', bg: '#2E271E', fg: '#F3B76A', title: 'Search “' + t.trim() + '”', meta: 'Nutrition · 12 matches · recent first' };
  }
  renderVals() {
    const text = this.state.text;
    const pv = this.parse(text);
    const set = (v) => () => this.setState({ text: v });
    return {
      text,
      onType: (e) => this.setState({ text: e.target.value }),
      hasPreview: !!pv,
      pv: pv || { tag: '', bg: 'transparent', fg: 'transparent', title: '', meta: '' },
      tiles: [
        { label: 'Water', c: '#62D6C6', pick: set('250 ml') },
        { label: 'Stack', c: '#62D6C6', pick: set('magnesium') },
        { label: 'Sleep', c: '#62D6C6', pick: set('slept 7h 24m') },
        { label: 'Meal', c: '#F3B76A', pick: set('chicken rice bowl') },
        { label: 'Expense', c: '#93A9FF', pick: set('rimi 23.40') },
        { label: 'Income', c: '#93A9FF', pick: set('freelance 600') },
        { label: 'Set', c: '#FF8F70', pick: set('bench 90x5') },
        { label: 'Habit', c: '#C5A1FF', pick: set('read 20 pages') }
      ],
      recent: [
        { label: 'Flat white', val: '€4.50', c: '#93A9FF' },
        { label: 'Whey shake + banana', val: '340 kcal', c: '#F3B76A' },
        { label: 'Water', val: '+250 ml', c: '#62D6C6' },
        { label: 'Magnesium glycinate', val: '400 mg', c: '#62D6C6' }
      ]
    };
  }
}
</script>
</body>
</html>
