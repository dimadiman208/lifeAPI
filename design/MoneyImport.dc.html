<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeAPI — Money integrations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
button{font-family:inherit}
.ph{width:390px;height:844px;border-radius:36px;background:#0A0B0D;border:1px solid #24262B;overflow:hidden;position:relative;box-sizing:border-box;flex:none}
.cap{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8E96;letter-spacing:.06em}
.lbl{font-size:14px;color:#EDEEF0;margin-top:14px;text-align:center}
.lbl small{display:block;color:#8A8E96;font-size:12px;margin-top:4px}
.card{border-radius:20px;border:1px solid #1F2125;background:#121316}
.ico{width:40px;height:40px;border-radius:20px;background:#1A1C20;color:#C9CBD0;display:flex;align-items:center;justify-content:center;border:0;flex:none}
.dl{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:48px;border-top:1px solid #1A1B1F}
.pill{height:24px;padding:0 8px;border-radius:12px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;flex:none}
.av{width:40px;height:40px;border-radius:12px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cb{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 1330px; height: 1100px; box-sizing: border-box; padding: 40px; background: #08090A; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px"><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Money — integrations, import, crypto</h1><span style="font-size: 13px; color: #A1A4AB">Everything is read-only; nothing can move money</span></header>
<div style="display: flex; gap: 40px; align-items: flex-start">

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="flex: 1; font-size: 18px; font-weight: 600">Connections</span></div>
<div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><span class="av" style="background: #2A2410; color: #F3D06A">B</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Binance</span><span style="font-size: 12px; color: #8A8E96">Read-only API key · 3 assets</span></span><span class="pill" style="background: #18261E; color: #8BE3A5">Synced 18:30</span></div>
<div style="display: flex; gap: 8px"><button style="flex: 1; height: 40px; border-radius: 12px; border: 1px solid #2C2F36; background: transparent; color: #EDEEF0; font-size: 13px">Sync now</button><button style="flex: 1; height: 40px; border-radius: 12px; border: 1px solid #2C2F36; background: transparent; color: #A1A4AB; font-size: 13px">Key settings</button></div>
</div>
<div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><span class="av" style="background: #2E271E; color: #F3B76A">S</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Swedbank</span><span style="font-size: 12px; color: #8A8E96">Open-banking link · concept</span></span><span class="pill" style="background: #1A1C20; color: #A1A4AB">Not linked</span></div>
<span style="font-size: 12px; line-height: 1.5; color: #A1A4AB">Works through a licensed PSD2 provider if one is available for your account. Read-only, renew consent every 180 days. Until then, CSV import below.</span>
<button style="height: 44px; border-radius: 12px; border: 0; background: #24262B; color: #EDEEF0; font-size: 14px; font-weight: 500">Check availability</button>
</div>
<div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><span class="av" style="background: #1E2233; color: #93A9FF">CSV</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Import statement</span><span style="font-size: 12px; color: #8A8E96">Swedbank · Revolut · generic CSV</span></span></div>
<span style="font-size: 12px; color: #A1A4AB">Last import: Swedbank_2026-10.csv · 51 rows · 1 Nov</span>
<button style="height: 44px; border-radius: 12px; border: 0; background: #93A9FF; color: #0A0B0D; font-size: 14px; font-weight: 600">Choose file</button>
</div>
<div class="card" style="overflow: hidden"><div class="dl" style="border-top: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Ledger wallet</span><span style="font-size: 12px; color: #8A8E96">Manual · you update quantities</span></span><span class="pill" style="background: #1A1C20; color: #A1A4AB">Manual</span></div></div>
</div>
</div>
<figcaption class="lbl">Connections<small>Binance API · Swedbank concept · CSV fallback · manual</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">Review import</span><span style="font-size: 12px; color: #8A8E96">Swedbank_2026-11.csv · 42 rows</span></span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div class="card" style="padding: 10px 12px"><span style="display: block; font-size: 11px; color: #8A8E96">New</span><span style="font-size: 18px; font-weight: 600">38</span></div>
<div class="card" style="padding: 10px 12px; border-color: #4A3A20"><span style="display: block; font-size: 11px; color: #F3B76A">Duplicates?</span><span style="font-size: 18px; font-weight: 600">3</span></div>
<div class="card" style="padding: 10px 12px"><span style="display: block; font-size: 11px; color: #8A8E96">No category</span><span style="font-size: 18px; font-weight: 600">1</span></div>
</div>
<div style="border-radius: 18px; border: 1px solid #4A3A20; background: #17140E; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span class="cap" style="color: #F3B76A">POSSIBLE DUPLICATE · 1 OF 3</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="border-radius: 12px; background: #0D0E10; padding: 10px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #8A8E96">From file</span><span style="font-size: 14px; font-weight: 600">RIMI LATVIJA</span><span style="font-size: 12px; color: #A1A4AB">14 Nov · −€23.40</span></div>
<div style="border-radius: 12px; background: #0D0E10; padding: 10px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #8A8E96">Already logged</span><span style="font-size: 14px; font-weight: 600">Rimi</span><span style="font-size: 12px; color: #A1A4AB">14 Nov · −€23.40 · Quick log</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="height: 40px; border-radius: 12px; border: 0; background: #F3B76A; color: #0A0B0D; font-size: 13px; font-weight: 600">Same — skip</button><button style="height: 40px; border-radius: 12px; border: 1px solid #4A3A20; background: transparent; color: #F3B76A; font-size: 13px; font-weight: 500">Keep both</button></div>
</div>
<div class="card" style="overflow: hidden">
<div class="dl" style="border-top: 0"><span class="cb" style="background: #93A9FF; color: #0A0B0D"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">BOLT.EU</span><span style="font-size: 12px; color: #8A8E96">13 Nov · Transport (auto)</span></span><span style="font-size: 14px; font-weight: 600">−€8.20</span></div>
<div class="dl"><span class="cb" style="background: #93A9FF; color: #0A0B0D"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">MAXIMA X</span><span style="font-size: 12px; color: #8A8E96">12 Nov · Groceries (auto)</span></span><span style="font-size: 14px; font-weight: 600">−€31.75</span></div>
<div class="dl"><span class="cb" style="background: #93A9FF; color: #0A0B0D"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">SIA DECATHLON</span><span style="font-size: 12px; color: #FF9A8F">12 Nov · pick a category</span></span><span style="font-size: 14px; font-weight: 600">−€39.99</span></div>
<div class="dl"><span class="cb" style="border: 1.5px solid #3A3F4A"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; color: #A1A4AB">Own account transfer</span><span style="font-size: 12px; color: #8A8E96">11 Nov · detected as transfer</span></span><span style="font-size: 14px; color: #A1A4AB">€600.00</span></div>
</div>
<button style="height: 52px; border-radius: 16px; border: 0; background: #93A9FF; color: #0A0B0D; font-size: 15px; font-weight: 600">Import 38 transactions</button>
</div>
</div>
<figcaption class="lbl">Import review<small>Side-by-side duplicate check · auto-categories · transfers detected</small></figcaption>
</figure>

<figure style="margin: 0">
<div class="ph">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span><span style="flex: 1; font-size: 18px; font-weight: 600">Crypto</span><span class="ico" aria-label="Add asset"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em">€14,217.66</span><span style="font-size: 13px; color: #8BE3A5">+€412.90 today · +16.4% all time</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div aria-hidden="true" style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px"><span style="flex: 73.2; background: #C5A1FF"></span><span style="flex: 21.9; background: #8C72B8"></span><span style="flex: 4.9; background: #574873"></span></div>
<div style="display: flex; gap: 14px; font-size: 12px; color: #A1A4AB"><span>BTC 73%</span><span>ETH 22%</span><span>SOL 5%</span></div></div>
<div class="card" style="overflow: hidden">
<sc-for list="{{ coins }}" as="c" hint-placeholder-count="3">
<div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-top: {{ c.div }}">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; width: 36px">{{ c.sym }}</span><span style="flex: 1; font-size: 14px; font-weight: 500">{{ c.qty }}</span><span style="font-size: 14px; font-weight: 600">{{ c.value }}</span></div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8A8E96"><span style="width: 36px"></span><span style="flex: 1">avg buy {{ c.avg }} · {{ c.src }}</span><span style="color: {{ c.plColor }}">{{ c.pl }}</span></div>
</div>
</sc-for>
</div>
<div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span class="cap">ADD MANUALLY</span>
<div style="display: grid; grid-template-columns: 90px 1fr; gap: 8px"><span style="height: 46px; border-radius: 12px; background: #0D0E10; border: 1px solid #24262B; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 14px">ETH ▾</span><span style="height: 46px; border-radius: 12px; background: #0D0E10; border: 1.5px solid #C5A1FF; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; font-size: 16px">0.35</span></div>
<span style="font-size: 12px; color: #8A8E96">Where: Ledger wallet · price from Binance feed</span>
</div>
</div>
</div>
<figcaption class="lbl">Crypto portfolio<small>Allocation, quantities, P/L, source per holding</small></figcaption>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      coins: [
        { sym: 'BTC', qty: '0.124', value: '€10,412.30', avg: '€68,900', src: 'Binance', pl: '+€1,868.70', plColor: '#8BE3A5', div: '0' },
        { sym: 'ETH', qty: '1.42', value: '€3,107.50', avg: '€2,040', src: 'Binance 1.07 + Ledger 0.35', pl: '+€210.70', plColor: '#8BE3A5', div: '1px solid #1A1B1F' },
        { sym: 'SOL', qty: '4.8', value: '€697.86', avg: '€162', src: 'Binance', pl: '−€79.74', plColor: '#FF9A8F', div: '1px solid #1A1B1F' }
      ]
    };
  }
}
</script>
</body>
</html>
